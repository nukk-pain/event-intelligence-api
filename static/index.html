<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="국내 AI와 로봇, 헬스케어 행사 일정과 해외 주요 행사를 날짜순으로 봅니다.">
<title>AI·로봇·헬스케어 행사 모아보기</title>
<link rel="stylesheet" href="/assets/theme.css?v=20260623-filterux">
<link rel="stylesheet" href="/assets/index.css?v=20260829-upcoming">
<link rel="stylesheet" href="/assets/list.css?v=20260623-filterux">
<link rel="stylesheet" href="/assets/detail.css?v=20260623-filterux">
<script defer src="/assets/ui.js?v=20260623-filterux"></script>
<script defer src="/assets/events.js?v=20260623-filterux"></script>
<script defer src="/assets/detail.js?v=20260727-nameen"></script>
<script defer src="/assets/app.js?v=20260831-location"></script>
<script defer src="/assets/ask.js?v=20260728-askui"></script>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <h1 class="site-title">AI·로봇·헬스케어 행사 모아보기</h1>
  </div>
</header>

<section class="ask" aria-label="질문으로 행사 찾기">
  <div class="ask-inner">
    <form id="ask-form" class="ask-form">
      <label for="ask-input" class="ask-lead">궁금한 걸 그대로 물어보세요</label>
      <div class="ask-row">
        <input id="ask-input" type="text" maxlength="200"
               placeholder="다음 달 서울 AI 행사 뭐 있어?" autocomplete="off">
        <button id="ask-submit" type="submit">행사 찾기</button>
      </div>
    </form>
    <p id="ask-state" class="ask-state" aria-live="polite" hidden></p>
    <div id="ask-results" class="ask-results" hidden></div>
  </div>
</section>

<section class="filters" aria-label="행사 필터">
  <div class="filters-inner">
    <div>
      <label for="f-list">목록</label>
      <select id="f-list">
        <option value="venue" selected>국내 행사 일정</option>
        <option value="benchmark">해외 주요 행사</option>
      </select>
    </div>
    <div>
      <label for="f-scope">행사 범위</label>
      <select id="f-scope">
        <option value="categorized" selected>주요 분야</option>
        <option value="all">전체 행사</option>
      </select>
    </div>
    <div>
      <label for="f-venue">장소</label>
      <select id="f-venue"><option value="">전체 장소</option></select>
    </div>
    <div class="date-field">
      <label for="f-date-from">기간</label>
      <input id="f-date-from" type="date" aria-label="시작일">
      <span class="date-sep" aria-hidden="true">~</span>
      <input id="f-date-to" type="date" aria-label="종료일">
    </div>
    <div class="search-field">
      <label for="f-search" class="sr-only">검색</label>
      <input id="f-search" type="search" placeholder="행사명 검색" aria-label="행사명 검색">
    </div>
    <label class="past-toggle" for="f-include-past">
      <input id="f-include-past" type="checkbox">
      지난 행사 포함
    </label>
    <div class="view-field">
      <span class="cat-field-label">보기</span>
      <div class="view-toggle" role="group" aria-label="보기 방식">
        <button id="view-list" class="view-btn" type="button" aria-pressed="true">목록</button>
        <button id="view-calendar" class="view-btn" type="button" aria-pressed="false">달력</button>
      </div>
    </div>
    <div class="cat-field">
      <span class="cat-field-label">분야</span>
      <div id="f-category-chips" class="cat-chips" role="group" aria-label="분야 필터"></div>
    </div>
    <span class="filter-count" id="filter-count" aria-live="polite"></span>
  </div>
</section>

<main>
  <section id="calendar-view" class="calendar-view hidden" aria-label="월간 행사 달력">
    <div class="calendar-toolbar">
      <button id="calendar-prev" type="button" aria-label="이전 달">이전</button>
      <h2 id="calendar-label"></h2>
      <button id="calendar-today" type="button">오늘</button>
      <button id="calendar-next" type="button" aria-label="다음 달">다음</button>
    </div>
    <div id="calendar-grid" class="calendar-grid" aria-live="polite"></div>
    <section id="calendar-undated" class="calendar-undated hidden" aria-label="일정 미정 행사"></section>
  </section>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="state" class="state hidden"></div>
  <button id="load-more" class="load-more hidden" type="button">더 보기</button>
</main>

<footer class="site">
  <div class="footer-inner">
    <span>국내 행사 일정과 해외 주요 행사를 분리해 보여줍니다.</span>
    <nav class="footer-links" aria-label="보조 정보">
      <a href="/api/v1/openapi.yaml">연동 안내</a>
      <a href="/llms.txt">요약 문서</a>
    </nav>
  </div>
</footer>

<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</body>
</html>
