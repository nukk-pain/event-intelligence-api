<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="COEX와 KINTEX의 AI, 로봇, 바이오, 의료기기 산업 행사를 한 곳에서 확인하세요.">
<title>COEX·KINTEX 산업 행사 모아보기</title>
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --surface-2: #f2efe8;
    --ink: #1a1815;
    --ink-2: #5a554d;
    --ink-3: #8a8478;
    --rule: #e3ded3;
    --accent: #0d5563;
    --accent-2: #0a3f4a;
    --link: #0d5563;
    --badge-bg: #f0ece2;
    --chip-ai: #c4604a;
    --chip-ai-bg: #f4e6df;
    --chip-robotics: #4a6a8a;
    --chip-robotics-bg: #e2e8f0;
    --chip-bio: #6a7d4a;
    --chip-bio-bg: #e8eedd;
    --chip-med: #8a5a3a;
    --chip-med-bg: #f0e4d6;
    --chip-health: #7a4a6a;
    --chip-health-bg: #ecdde6;
    --status-tentative: #b58524;
    --status-tentative-bg: #fbf0d4;
    --status-postponed: #b55a2a;
    --status-postponed-bg: #f7e1d0;
    --status-cancelled: #a83232;
    --status-cancelled-bg: #f4d9d9;
    --status-ended: #5a554d;
    --status-ended-bg: #e6e2d8;
    --cost-free: #2a6a3a;
    --cost-free-bg: #dce8d8;
    --cost-paid: #8a5a2a;
    --cost-paid-bg: #f0e2cc;
    --cost-mixed: #5a4a8a;
    --cost-mixed-bg: #e2dde8;
    --modal-overlay: rgba(26, 24, 21, 0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1b18;
      --surface: #26231f;
      --surface-2: #2e2a25;
      --ink: #ede8df;
      --ink-2: #b0aa9e;
      --ink-3: #8a8478;
      --rule: #3a352e;
      --accent: #5fb0c2;
      --accent-2: #4a8a9a;
      --link: #5fb0c2;
      --badge-bg: #2e2a25;
      --chip-ai-bg: #3a2a24;
      --chip-ai: #e08a72;
      --chip-robotics-bg: #2a3540;
      --chip-robotics: #8aa8c8;
      --chip-bio-bg: #2e3a28;
      --chip-bio: #a2b88a;
      --chip-med-bg: #3a2e22;
      --chip-med: #c89070;
      --chip-health-bg: #352a35;
      --chip-health: #b888a8;
      --status-tentative-bg: #3a3020;
      --status-tentative: #e8b84a;
      --status-postponed-bg: #3a2820;
      --status-postponed: #e89070;
      --status-cancelled-bg: #3a2020;
      --status-cancelled: #e88080;
      --status-ended-bg: #2e2a25;
      --status-ended: #b0aa9e;
      --cost-free-bg: #283628;
      --cost-free: #9ac890;
      --cost-paid-bg: #3a2e1f;
      --cost-paid: #d0a878;
      --cost-mixed-bg: #2a243a;
      --cost-mixed: #b0a0d0;
      --modal-overlay: rgba(0, 0, 0, 0.72);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    word-break: keep-all;
    line-break: strict;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .num { font-variant-numeric: tabular-nums; }

  /* Header */
  header.site {
    border-bottom: 1px solid var(--rule);
    padding: 28px 24px 22px;
    background: var(--surface);
  }
  .site-inner { max-width: 1200px; margin: 0 auto; }
  .site-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }
  .site-title .accent-dot { color: var(--accent); }
  .site-desc {
    margin: 6px 0 12px;
    color: var(--ink-2);
    font-size: 14px;
    max-width: 70ch;
  }
  .site-links {
    display: flex;
    gap: 18px;
    font-size: 12.5px;
    color: var(--ink-3);
    flex-wrap: wrap;
  }
  .site-links a { color: var(--ink-2); border-bottom: 1px dotted var(--ink-3); padding-bottom: 1px; }
  .site-links a:hover { color: var(--accent); border-bottom-color: var(--accent); text-decoration: none; }

  /* Filter bar */
  .filters {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: 12px 24px;
  }
  .filters-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filters label {
    font-size: 12px;
    color: var(--ink-3);
    margin-right: 6px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  select, input[type="search"] {
    font: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 6px 10px;
    appearance: none;
    -webkit-appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a8478' stroke-width='1.4'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
  }
  input[type="search"] {
    flex: 1;
    min-width: 200px;
    max-width: 360px;
  }
  select:focus, input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  .filter-count {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* Main */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* Event grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 16px;
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header.site, .filters { padding-left: 16px; padding-right: 16px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 16px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    text-align: left;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 1px 0 var(--accent), 0 4px 16px rgba(13, 85, 99, 0.08);
    outline: none;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .card-date {
    font-size: 12.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }
  .card-name {
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--ink);
    letter-spacing: -0.005em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-venue {
    font-size: 13px;
    color: var(--ink-2);
  }
  .card-venue .hall { color: var(--ink-3); }
  .card-summary {
    font-size: 13px;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
  }
  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }
  .chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .chip.cat-ai { background: var(--chip-ai-bg); color: var(--chip-ai); }
  .chip.cat-humanoid-robotics { background: var(--chip-robotics-bg); color: var(--chip-robotics); }
  .chip.cat-bio { background: var(--chip-bio-bg); color: var(--chip-bio); }
  .chip.cat-medical-devices { background: var(--chip-med-bg); color: var(--chip-med); }
  .chip.cat-digital-health { background: var(--chip-health-bg); color: var(--chip-health); }

  .chip.status-tentative { background: var(--status-tentative-bg); color: var(--status-tentative); }
  .chip.status-postponed { background: var(--status-postponed-bg); color: var(--status-postponed); }
  .chip.status-cancelled { background: var(--status-cancelled-bg); color: var(--status-cancelled); }
  .chip.status-ended { background: var(--status-ended-bg); color: var(--status-ended); }

  .chip.cost-free { background: var(--cost-free-bg); color: var(--cost-free); }
  .chip.cost-paid { background: var(--cost-paid-bg); color: var(--cost-paid); }
  .chip.cost-mixed { background: var(--cost-mixed-bg); color: var(--cost-mixed); }

  /* More button and states */
  .load-more {
    margin: 24px auto 0;
    display: block;
    padding: 9px 28px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .load-more:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .load-more:disabled { color: var(--ink-3); cursor: default; }

  .state {
    padding: 48px 16px;
    text-align: center;
    color: var(--ink-2);
    font-size: 14px;
  }
  .state.error { color: var(--status-cancelled); }
  .state strong { color: var(--ink); font-weight: 600; display: block; margin-bottom: 4px; }

  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 16px 18px;
    height: 140px;
    position: relative;
    overflow: hidden;
  }
  .skeleton-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--surface-2), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  /* Footer */
	  footer.site {
	    border-top: 1px solid var(--rule);
	    margin-top: 40px;
	    padding: 18px 24px;
	    color: var(--ink-3);
	    font-size: 12.5px;
	    text-align: center;
	    overflow-wrap: anywhere;
	  }
	  footer.site span { display: inline-block; max-width: 100%; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    z-index: 100;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 5px;
    max-width: 720px;
    width: 100%;
    margin: auto;
    padding: 28px 32px 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  @media (max-width: 720px) {
    .modal { padding: 22px 20px; }
    .modal-overlay { padding: 16px; }
  }
  .modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--ink-3);
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--ink); }
  .modal h2 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.35;
    margin: 0 0 6px;
    color: var(--ink);
    max-width: 88%;
  }
  .modal h3 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin: 22px 0 8px;
    border-top: 1px solid var(--rule);
    padding-top: 14px;
  }
  .modal h3:first-of-type { border-top: none; padding-top: 0; }
  .modal .modal-meta {
    color: var(--ink-2);
    font-size: 13.5px;
    margin-bottom: 4px;
  }
  .modal .modal-badges { margin: 8px 0 4px; }
  .dl {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 6px 14px;
    margin: 8px 0 0;
    font-size: 13.5px;
  }
  .dl dt { color: var(--ink-3); }
  .dl dd { margin: 0; color: var(--ink); }
  .modal ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; color: var(--ink); }
  .modal ul li { margin-bottom: 3px; }
  .source-list { list-style: none; padding-left: 0; }
  .source-list li {
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
  }
  .source-list li:last-child { border-bottom: none; }
  .source-list a { display: block; word-break: break-all; }
  .source-meta { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .gaps {
    font-size: 12.5px;
    color: var(--ink-3);
    background: var(--badge-bg);
    padding: 8px 12px;
    border-radius: 3px;
    line-height: 1.6;
  }
  .modal-links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 13.5px; }
  .hidden, .modal-overlay.hidden { display: none; }
	</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <h1 class="site-title">COEX·KINTEX 산업 행사 모아보기<span class="accent-dot">.</span></h1>
    <p class="site-desc">AI, 로봇, 바이오, 의료기기 분야 행사를 빠르게 훑고 다음에 갈 곳을 고르세요.</p>
    <nav class="site-links" aria-label="관련 정보">
      <a href="/api/v1">서비스 정보</a>
      <a href="/api/v1/schema">데이터 항목</a>
      <a href="/api/v1/openapi.yaml">연동 안내</a>
      <a href="/llms.txt">요약 문서</a>
    </nav>
  </div>
</header>

<section class="filters" aria-label="행사 필터">
  <div class="filters-inner">
    <div>
      <label for="f-period">일정</label>
      <select id="f-period">
        <option value="upcoming" selected>예정 행사</option>
        <option value="past">지난 행사</option>
        <option value="all">전체 기간</option>
      </select>
    </div>
    <div>
      <label for="f-category">분야</label>
      <select id="f-category"><option value="">전체 분야</option></select>
    </div>
    <div>
      <label for="f-venue">장소</label>
      <select id="f-venue"><option value="">전체 장소</option></select>
    </div>
    <div style="flex:1; min-width:200px;">
      <label for="f-search" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">검색</label>
      <input id="f-search" type="search" placeholder="행사명이나 설명 검색" aria-label="행사명이나 설명 검색">
    </div>
    <span class="filter-count" id="filter-count" aria-live="polite"></span>
  </div>
</section>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="state" class="state hidden"></div>
  <button id="load-more" class="load-more hidden" type="button">더 보기</button>
</main>

<footer class="site">
  <span>COEX와 KINTEX의 공개 행사 정보를 정리해 보여줍니다.</span>
</footer>

<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>

<script>
(function() {
  "use strict";

  var CAT_LABELS = {
    "ai": "AI",
    "humanoid-robotics": "로봇",
    "bio": "바이오",
    "medical-devices": "의료기기",
    "digital-health": "디지털 헬스"
  };
  var STATUS_LABELS = {
    "tentative": "일정 미정",
    "postponed": "연기",
    "cancelled": "취소",
    "ended": "종료"
  };
  var COST_LABELS = { "free": "무료", "paid": "유료", "mixed": "무료+유료" };
  var UPDATE_LABELS = {
    "new": "새로 확인", "unchanged": "변경 없음",
    "updated": "업데이트됨", "conflicting": "확인 필요"
  };

  var state = {
    events: [],
    cursor: null,
    hasMore: false,
    loading: false,
    period: "upcoming",
    category: "",
    venue: "",
    search: ""
  };

  var el = {
    grid: document.getElementById("grid"),
    stateBox: document.getElementById("state"),
    loadMore: document.getElementById("load-more"),
    fPeriod: document.getElementById("f-period"),
    fCategory: document.getElementById("f-category"),
    fVenue: document.getElementById("f-venue"),
    fSearch: document.getElementById("f-search"),
    count: document.getElementById("filter-count"),
    overlay: document.getElementById("modal-overlay")
  };

  function humanizeCat(slug) { return CAT_LABELS[slug] || slug; }

  function fmtDateRange(s, e) {
    if (!s) return "일정 미정";
    if (!e || s === e) return s;
    return s + " \u2013 " + e;
  }

  function fmtDate(s) { return s || "\u2014"; }

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function chipFor(cat) {
    return '<span class="chip cat-' + cat + '">' + escapeHtml(humanizeCat(cat)) + '</span>';
  }

  function statusChip(e) {
    if (!e.status || e.status === "scheduled") return "";
    return '<span class="chip status-' + e.status + '">' + (STATUS_LABELS[e.status] || e.status) + '</span>';
  }

  function costChip(e) {
    if (!e.cost_hint || e.cost_hint === "unknown") return "";
    return '<span class="chip cost-' + e.cost_hint + '">' + (COST_LABELS[e.cost_hint] || e.cost_hint) + '</span>';
  }

  function venueLine(e) {
    if (!e.venue) return "";
    var v = e.venue;
    var parts = [];
    if (v.name) parts.push(escapeHtml(v.name));
    if (v.city) parts.push(escapeHtml(v.city));
    if (v.hall) parts.push('<span class="hall">' + escapeHtml(v.hall) + '</span>');
    return parts.length ? parts.join(" \u00b7 ") : "";
  }

  function renderCard(e) {
    var badges = (e.categories || []).map(chipFor).join("");
    var st = statusChip(e);
    var co = costChip(e);
    var summary = e.summary
      ? '<p class="card-summary">' + escapeHtml(e.summary) + '</p>'
      : "";
    return (
      '<button class="card" type="button" data-id="' + escapeHtml(e.event_id) + '" aria-label="' + escapeHtml(e.name) + ' 상세 보기">' +
        '<div class="card-head">' +
          '<div class="card-date num">' + escapeHtml(fmtDateRange(e.start_date, e.end_date)) + '</div>' +
        '</div>' +
        '<div class="card-name">' + escapeHtml(e.name) + '</div>' +
        (venueLine(e) ? '<div class="card-venue">' + venueLine(e) + '</div>' : "") +
        summary +
        '<div class="card-badges">' + badges + st + co + '</div>' +
      '</button>'
    );
  }

  function visibleEvents() {
    if (!state.search) return state.events;
    var q = state.search.toLowerCase();
    return state.events.filter(function(e) {
      var name = (e.name || "").toLowerCase();
      var summary = (e.summary || "").toLowerCase();
      return name.indexOf(q) !== -1 || summary.indexOf(q) !== -1;
    });
  }

  function renderList() {
    var evs = visibleEvents();
    el.grid.innerHTML = evs.map(renderCard).join("");
    updateCount(evs.length);
    el.loadMore.classList.toggle("hidden", !state.hasMore || state.search);
    el.grid.querySelectorAll(".card").forEach(function(btn) {
      btn.addEventListener("click", function() { openDetail(btn.getAttribute("data-id")); });
    });
  }

  function updateCount(visible) {
    var total = state.events.length;
    if (state.search && visible !== total) {
      el.count.textContent = total + "개 중 " + visible + "개 표시" + (state.hasMore ? "+" : "");
    } else {
      el.count.textContent = total + (state.hasMore ? "+" : "") + "개 행사";
    }
  }

  function showState(msg, isError) {
    el.grid.innerHTML = "";
    el.stateBox.textContent = msg;
    el.stateBox.className = "state" + (isError ? " error" : "");
    el.stateBox.classList.remove("hidden");
    el.loadMore.classList.add("hidden");
  }

  function showSkeletons(n) {
    el.stateBox.classList.add("hidden");
    var html = "";
    for (var i = 0; i < n; i++) html += '<div class="skeleton-card"></div>';
    el.grid.innerHTML = html;
  }

  function fetchJSON(url) {
    return fetch(url, { headers: { "Accept": "application/json" } }).then(function(r) {
      if (r.status === 429) {
        var retry = r.headers.get("Retry-After");
        var msg = "잠시 후 다시 시도해주세요.";
        if (retry) msg += " " + retry + "초 뒤에 다시 열 수 있습니다.";
        var err = new Error(msg);
        err.rateLimited = true;
        err.retryAfter = retry;
        throw err;
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function loadEvents(append) {
    if (state.loading) return Promise.resolve();
    state.loading = true;
    if (!append) showSkeletons(6);
    el.loadMore.disabled = true;
    el.loadMore.textContent = "불러오는 중...";

    var url = "/api/v1/events?limit=20";
    var today = new Date().toISOString().slice(0, 10);
    if (state.period === "upcoming") url += "&since=" + today;
    else if (state.period === "past") url += "&before=" + today;
    if (state.category) url += "&category=" + encodeURIComponent(state.category);
    if (state.venue) url += "&venue=" + encodeURIComponent(state.venue);
    if (append && state.cursor) url += "&cursor=" + encodeURIComponent(state.cursor);

    return fetchJSON(url).then(function(d) {
      var data = d.data || [];
      if (append) state.events = state.events.concat(data);
      else state.events = data;
      state.cursor = d.page && d.page.next_cursor;
      state.hasMore = !!(d.page && d.page.has_more);
      state.loading = false;
      if (state.events.length === 0 && !state.search) {
        showState("조건에 맞는 행사가 없습니다.", false);
      } else {
        renderList();
      }
      el.loadMore.textContent = "더 보기";
      el.loadMore.disabled = false;
    }).catch(function(err) {
      state.loading = false;
      el.loadMore.textContent = "더 보기";
      el.loadMore.disabled = false;
      showState(err.message || "행사를 불러오지 못했습니다.", true);
    });
  }

  function openDetail(id) {
    el.overlay.innerHTML = '<div class="modal"><button class="modal-close" aria-label="닫기">\u00d7</button><p style="color:var(--ink-3)">불러오는 중...</p></div>';
    el.overlay.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    var prevFocus = document.activeElement;

    var detailID = encodeURIComponent(id);
    Promise.all([
      fetchJSON("/api/v1/events/" + detailID),
      fetchJSON("/api/v1/events/" + detailID + "/sources")
    ]).then(function(res) {
      var event = (res[0] && res[0].data) || res[0] || {};
      var sources = (res[1] && res[1].data) || res[1] || [];
      renderModal(event, sources);
      bindModalClose(close);
    }).catch(function(err) {
      el.overlay.innerHTML = '<div class="modal"><button class="modal-close" aria-label="닫기">\u00d7</button><p style="color:var(--status-cancelled)">' + escapeHtml(err.message || "행사를 불러오지 못했습니다.") + '</p></div>';
      bindModalClose(close);
    });

    function close() {
      el.overlay.classList.add("hidden");
      el.overlay.innerHTML = "";
      document.body.style.overflow = "";
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    }
    el.overlay._close = close;
    el.overlay.onclick = function(ev) { if (ev.target === el.overlay) close(); };
    bindModalClose(close);
  }

  function bindModalClose(close) {
    var closeBtn = el.overlay.querySelector(".modal-close");
    if (closeBtn) closeBtn.onclick = close;
  }

  function renderModal(e, sources) {
    var badges = (e.categories || []).map(chipFor).join("") + statusChip(e) + costChip(e);
    var dt = [];

    function row(label, val) {
      if (val == null || val === "") return;
      dt.push('<dt>' + escapeHtml(label) + '</dt><dd>' + val + '</dd>');
    }

    row("일정", '<span class="num">' + escapeHtml(fmtDateRange(e.start_date, e.end_date)) + '</span>');
    row("시간대", escapeHtml(e.timezone));
    row("진행 방식", escapeHtml(e.format));
    if (e.venue) {
      var vParts = [];
      if (e.venue.name) vParts.push(escapeHtml(e.venue.name));
      if (e.venue.city) vParts.push(escapeHtml(e.venue.city));
      if (e.venue.hall) vParts.push(escapeHtml(e.venue.hall));
      row("장소", vParts.join(" \u00b7 "));
    }
    row("국가", escapeHtml(e.country));
    if (e.audience && e.audience.length) {
      row("대상", e.audience.map(escapeHtml).join(", "));
    }
    if (e.scale) {
      var sc = [];
      if (e.scale.exhibitors != null) sc.push(escapeHtml(e.scale.exhibitors) + "개 참가사");
      if (e.scale.visitors != null) sc.push(escapeHtml(e.scale.visitors) + "명 방문");
      if (sc.length) row("규모", sc.join(" \u00b7 "));
    }
    row("회차", escapeHtml(e.edition));
    row("참가 신청 마감", '<span class="num">' + escapeHtml(fmtDate(e.registration_deadline)) + '</span>');
    row("부스 신청 마감", '<span class="num">' + escapeHtml(fmtDate(e.exhibitor_deadline)) + '</span>');

    var links = [];
    if (e.homepage_url) links.push('<a href="' + escapeHtml(e.homepage_url) + '" target="_blank" rel="noopener">공식 홈페이지 \u2197</a>');
    if (e.register_url) links.push('<a href="' + escapeHtml(e.register_url) + '" target="_blank" rel="noopener">참가 신청 \u2197</a>');
    if (e.exhibit_url) links.push('<a href="' + escapeHtml(e.exhibit_url) + '" target="_blank" rel="noopener">부스 문의 \u2197</a>');
    if (links.length) row("바로가기", '<div class="modal-links">' + links.join("") + '</div>');

    if (e.summary) {
      dt.push('<dt>소개</dt><dd>' + escapeHtml(e.summary) + '</dd>');
    }

    var sourcesHtml = (sources && sources.length)
      ? '<ul class="source-list">' + sources.map(function(s) {
          return '<li><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.url) + '</a>' +
            '<div class="source-meta">' + escapeHtml(s.publisher || "") + (s.publisher && s.type ? " \u00b7 " : "") + escapeHtml(s.type || "") +
            (s.retrieved_at ? ' \u00b7 확인일 ' + escapeHtml(s.retrieved_at.slice(0, 10)) : '') + '</div></li>';
        }).join("") + '</ul>'
      : '<p style="color:var(--ink-3);font-size:13px">출처가 아직 정리되지 않았습니다.</p>';

    var gaps = (e.missing_fields && e.missing_fields.length)
      ? '<div class="gaps">' + e.missing_fields.map(function(f) {
          return escapeHtml(f);
        }).join(" \u00b7 ") + '</div>'
      : '<p style="color:var(--ink-3);font-size:13px">현재 표시할 누락 정보가 없습니다.</p>';

    var dq = [];
    if (e.confidence) dq.push('<dt>정보 신뢰도</dt><dd>' + escapeHtml(e.confidence) + '</dd>');
    if (e.date_confidence) dq.push('<dt>일정 신뢰도</dt><dd>' + escapeHtml(e.date_confidence) + '</dd>');
    if (e.update_state) dq.push('<dt>최근 변경</dt><dd>' + escapeHtml(UPDATE_LABELS[e.update_state] || e.update_state) + '</dd>');
    if (e.last_checked_at) dq.push('<dt>마지막 확인</dt><dd><span class="num">' + escapeHtml(e.last_checked_at.slice(0, 10)) + '</span></dd>');

    var html =
      '<div class="modal" role="document">' +
        '<button class="modal-close" aria-label="닫기">\u00d7</button>' +
        '<h2 id="modal-title">' + escapeHtml(e.name) + '</h2>' +
        (badges ? '<div class="modal-badges">' + badges + '</div>' : '') +
        (e.summary ? '<p class="modal-meta" style="margin-top:8px">' + escapeHtml(e.summary) + '</p>' : '') +
        (dt.length ? '<dl class="dl">' + dt.join("") + '</dl>' : '') +
        (dq.length ? '<h3>정보 확인 상태</h3><dl class="dl">' + dq.join("") + '</dl>' : '') +
        '<h3>아직 부족한 정보</h3>' + gaps +
        '<h3>출처</h3>' + sourcesHtml +
      '</div>';

    el.overlay.innerHTML = html;
    var c = el.overlay.querySelector(".modal-close");
    if (c) c.focus();
  }

  function populateFilters(vocab) {
    (vocab.categories || []).forEach(function(slug) {
      var o = document.createElement("option");
      o.value = slug; o.textContent = humanizeCat(slug);
      el.fCategory.appendChild(o);
    });
    (vocab.venues || []).forEach(function(slug) {
      var o = document.createElement("option");
      o.value = slug; o.textContent = slug.toUpperCase();
      el.fVenue.appendChild(o);
    });
  }

  function debounce(fn, ms) {
    var t;
    return function() {
      var a = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function() { fn.apply(ctx, a); }, ms);
    };
  }

  // Wire controls
  el.fPeriod.addEventListener("change", function() {
    state.period = el.fPeriod.value;
    state.cursor = null; state.events = [];
    loadEvents(false);
  });
  el.fCategory.addEventListener("change", function() {
    state.category = el.fCategory.value;
    state.cursor = null; state.events = [];
    loadEvents(false);
  });
  el.fVenue.addEventListener("change", function() {
    state.venue = el.fVenue.value;
    state.cursor = null; state.events = [];
    loadEvents(false);
  });
  el.fSearch.addEventListener("input", debounce(function() {
    state.search = el.fSearch.value.trim();
    renderList();
  }, 200));
  el.loadMore.addEventListener("click", function() { loadEvents(true); });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape" && !el.overlay.classList.contains("hidden")) {
      if (el.overlay._close) el.overlay._close();
    }
  });

  // Initial load
  Promise.all([
    fetchJSON("/api/v1"),
    loadEvents(false)
  ]).then(function(res) {
    if (res[0] && res[0].vocabularies) populateFilters(res[0].vocabularies);
  }).catch(function() {
    // loadEvents already shows the error state.
  });
})();
</script>
</body>
</html>
