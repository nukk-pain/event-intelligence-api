<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="COEX와 KINTEX 공개 행사 일정을 한 곳에서 날짜순으로 확인하세요.">
<title>행사 모아보기</title>
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/index.css">
<link rel="stylesheet" href="/assets/list.css">
<link rel="stylesheet" href="/assets/detail.css">
<script defer src="/assets/ui.js"></script>
<script defer src="/assets/events.js"></script>
<script defer src="/assets/detail.js"></script>
<script defer src="/assets/app.js?v=20260623-opportunity"></script>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <h1 class="site-title">행사 모아보기</h1>
  </div>
</header>

<section class="filters" aria-label="행사 필터">
  <div class="filters-inner">
    <div>
      <label for="f-scope">행사 범위</label>
      <select id="f-scope">
        <option value="categorized" selected>주요 분야</option>
        <option value="opportunity">기회 shortlist</option>
        <option value="all">모든 행사 보기</option>
      </select>
    </div>
    <div>
      <label for="f-category">분야</label>
      <select id="f-category"><option value="">전체 분야</option></select>
    </div>
    <div>
      <label for="f-venue">장소</label>
      <select id="f-venue"><option value="">전체 장소</option></select>
    </div>
    <div class="search-field">
      <label for="f-search" class="sr-only">검색</label>
      <input id="f-search" type="search" placeholder="행사명 검색" aria-label="행사명 검색">
    </div>
    <span class="filter-count" id="filter-count" aria-live="polite"></span>
  </div>
</section>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="state" class="state hidden"></div>
  <button id="load-more" class="load-more hidden" type="button">더 보기</button>
</main>

<footer class="site">
  <div class="footer-inner">
    <span>COEX와 KINTEX의 공개 예정 일정을 정리해 보여줍니다.</span>
    <nav class="footer-links" aria-label="보조 정보">
      <a href="/api/v1/openapi.yaml">연동 안내</a>
      <a href="/llms.txt">요약 문서</a>
    </nav>
  </div>
</footer>

<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</body>
</html>
