<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>AI·로봇·헬스케어 행사 모아보기 Promo</title>
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --surface-2: #f2efe8;
    --ink: #1a1815;
    --ink-2: #5a554d;
    --ink-3: #8a8478;
    --rule: #e3ded3;
    --accent: #0d5563;
    --accent-2: #0a3f4a;
    --ai: #c4604a;
    --ai-bg: #f4e6df;
    --robotics: #4a6a8a;
    --robotics-bg: #e2e8f0;
    --bio: #6a7d4a;
    --bio-bg: #e8eedd;
    --health: #7a4a6a;
    --health-bg: #ecdde6;
  }
  * { box-sizing: border-box; }
  html,
  body {
    margin: 0;
    width: 1200px;
    height: 675px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "IBM Plex Sans", system-ui, sans-serif;
    letter-spacing: 0;
    word-break: keep-all;
  }
  body {
    padding: 42px 56px;
  }
  .stage {
    position: relative;
    width: 1088px;
    height: 591px;
  }
  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--ink-3);
    font-size: 17px;
    font-weight: 600;
  }
  .url {
    color: var(--accent);
  }
  h1 {
    width: 740px;
    margin: 72px 0 22px;
    font-size: 66px;
    line-height: 1.12;
    font-weight: 700;
  }
  .lead {
    width: 640px;
    color: var(--ink-2);
    font-size: 27px;
    line-height: 1.45;
  }
  .panel {
    position: absolute;
    right: 0;
    top: 92px;
    width: 472px;
    height: 422px;
    padding: 20px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 8px 40px rgba(13, 85, 99, 0.12);
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .select {
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink-2);
    background: var(--surface-2);
    font-size: 15px;
  }
  .select.active {
    border-color: var(--accent);
    color: var(--accent-2);
    background: #eef6f7;
    font-weight: 700;
  }
  .count {
    margin: 0 0 12px;
    color: var(--ink-2);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .cards {
    display: grid;
    gap: 10px;
  }
  .card {
    min-height: 74px;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--surface);
  }
  .date {
    margin-bottom: 5px;
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .name {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
  }
  .meta {
    margin-top: 5px;
    color: var(--ink-3);
    font-size: 13px;
  }
  .chips {
    display: flex;
    gap: 7px;
    margin-top: 8px;
  }
  .chip {
    padding: 4px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .chip.ai { color: var(--ai); background: var(--ai-bg); }
  .chip.robotics { color: var(--robotics); background: var(--robotics-bg); }
  .chip.bio { color: var(--bio); background: var(--bio-bg); }
  .chip.health { color: var(--health); background: var(--health-bg); }
  .metrics {
    position: absolute;
    left: 0;
    bottom: 20px;
    display: flex;
    gap: 12px;
  }
  .metric {
    min-width: 148px;
    padding: 16px 18px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--surface);
  }
  .metric strong {
    display: block;
    color: var(--accent);
    font-size: 34px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .metric span {
    display: block;
    margin-top: 7px;
    color: var(--ink-2);
    font-size: 14px;
  }
  .cta {
    position: absolute;
    right: 0;
    bottom: 20px;
    width: 472px;
    padding: 18px 20px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: #eef6f7;
    color: var(--accent-2);
    font-size: 22px;
    font-weight: 800;
  }
  .fade {
    opacity: var(--o, 1);
    transform: translateY(var(--y, 0));
  }
</style>
</head>
<body>
<div class="stage">
  <div class="topline fade" id="topline">
    <span>공식 출처 기반 행사 인텔리전스</span>
    <span class="url">events.nukk.net</span>
  </div>
  <h1 class="fade" id="title">AI·로봇·헬스케어 행사 모아보기</h1>
  <p class="lead fade" id="lead">국내 행사 일정과 글로벌 주요 행사를 한 화면에서 비교하세요.</p>
  <div class="metrics fade" id="metrics">
    <div class="metric"><strong>31</strong><span>글로벌 주요 행사</span></div>
    <div class="metric"><strong>95</strong><span>COEX 공개 일정</span></div>
    <div class="metric"><strong>38</strong><span>KINTEX 공개 일정</span></div>
  </div>
  <div class="panel fade" id="panel">
    <div class="controls">
      <div class="select" id="domestic">국내 행사 일정</div>
      <div class="select" id="global">글로벌 주요 행사</div>
    </div>
    <p class="count" id="count">95개 주요 국내 행사</p>
    <div class="cards" id="cards"></div>
  </div>
  <div class="cta fade" id="cta">무료 공개 API와 웹 UI로 바로 확인</div>
</div>
<script>
  const frame = Number(new URLSearchParams(location.search).get("frame") || 0);
  const total = 64;
  const t = Math.max(0, Math.min(1, frame / (total - 1)));
  const smooth = (a, b, x) => {
    const p = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return p * p * (3 - 2 * p);
  };
  const setFade = (id, start, end, distance) => {
    const p = smooth(start, end, t);
    const el = document.getElementById(id);
    el.style.setProperty("--o", p.toFixed(3));
    el.style.setProperty("--y", `${Math.round((1 - p) * distance)}px`);
  };
  setFade("topline", 0.00, 0.12, 10);
  setFade("title", 0.04, 0.20, 18);
  setFade("lead", 0.13, 0.30, 14);
  setFade("panel", 0.22, 0.42, 24);
  setFade("metrics", 0.44, 0.62, 18);
  setFade("cta", 0.68, 0.84, 14);

  const globalMode = t >= 0.36;
  document.getElementById(globalMode ? "global" : "domestic").classList.add("active");
  document.getElementById("count").textContent = globalMode ? "31개 글로벌 주요 행사" : "95개 주요 국내 행사";
  const domestic = [
    ["2026-06-23 – 2026-06-25", "제약·바이오 국내 컨퍼런스", "COEX · Seoul", ["bio", "health"]],
    ["2026-07-02 – 2026-07-04", "AI·디지털헬스 박람회", "KINTEX · Goyang", ["ai", "health"]],
    ["2026-08-19 – 2026-08-21", "로봇 자동화 전시", "COEX · Seoul", ["robotics", "ai"]]
  ];
  const global = [
    ["2026-07-17 – 2026-07-20", "World Artificial Intelligence Conference", "Shanghai · China", ["ai"]],
    ["2026-08-19 – 2026-08-23", "World Robot Conference", "Beijing · China", ["robotics", "ai"]],
    ["2026-11-15 – 2026-11-18", "HLTH USA", "Las Vegas · USA", ["health", "bio"]]
  ];
  const labels = { ai: "AI", robotics: "로봇", bio: "바이오", health: "헬스케어" };
  const rows = globalMode ? global : domestic;
  document.getElementById("cards").innerHTML = rows.map((row, i) => {
    const p = smooth(0.28 + i * 0.06, 0.44 + i * 0.06, t);
    const chips = row[3].map(c => `<span class="chip ${c}">${labels[c]}</span>`).join("");
    return `<div class="card" style="opacity:${p};transform:translateX(${Math.round((1 - p) * 18)}px)">
      <div class="date">${row[0]}</div>
      <div class="name">${row[1]}</div>
      <div class="meta">${row[2]}</div>
      <div class="chips">${chips}</div>
    </div>`;
  }).join("");
</script>
</body>
</html>
